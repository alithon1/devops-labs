limit_req_zone $binary_remote_addr zone=mylimit:10m rate=2r/s;

upstream backend_servers {
    server 127.0.0.1:8080;
    server 127.0.0.1:8081;
}

# 1. Редирект с HTTP (80) на HTTPS (443)
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# 2. Основной HTTPS сервер
server {
    listen 443 ssl;
    server_name localhost;

    # Сертификаты
    ssl_certificate /Users/cubelime/Desktop/devops-labs/lab1/localhost.pem;
    ssl_certificate_key /Users/cubelime/Desktop/devops-labs/lab1/localhost-key.pem;

    location /admin {
        auth_basic "Admin Area";
        auth_basic_user_file /opt/homebrew/etc/nginx/.htpasswd;
        root /Users/cubelime/Desktop/devops-labs/lab1/www;
        try_files /admin.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /Users/cubelime/Desktop/devops-labs/lab1/www;
        internal;
    }

    # Папка с index.html
    location / {
        root /Users/cubelime/Desktop/devops-labs/lab0/src/main/resources/static;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Проксирование на бэкенд
    location /api {
        limit_req zone=mylimit burst=3 nodelay;
        limit_req_status 429; 
        proxy_intercept_errors on;
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs {
    alias /Users/cubelime/Desktop/devops-labs/lab1/docs/;

    }
  
}
server {
    listen 443 ssl;
    server_name second.local;

    ssl_certificate /Users/cubelime/Desktop/devops-labs/lab1/localhost.pem;
    ssl_certificate_key /Users/cubelime/Desktop/devops-labs/lab1/localhost-key.pem;

    location / {
        return 200 "Это второй сайт (second.local)\n";
    }
}
